<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Pagina non trovata | Ermanno Colazzo</title>
  <meta name="description" content="La pagina richiesta non è disponibile.">
  <link rel="icon" type="image/png" href="/logo-emblem.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .error-page{min-height:100vh;display:grid;place-items:center;padding:2rem;background:linear-gradient(145deg,#eef4fb,#fff)}
    .error-card{width:min(680px,100%);padding:clamp(2rem,6vw,4rem);text-align:center;background:#fff;border:1px solid #d9e4f0;border-radius:24px;box-shadow:0 18px 45px rgba(0,60,129,.12)}
    .error-card img{width:130px;height:auto;margin:0 auto 1.5rem}
    .error-code{margin:0;color:#003c81;font-size:clamp(4rem,14vw,7rem);font-weight:800;line-height:1}
    .error-card h1{margin:.75rem 0;font-size:clamp(1.8rem,5vw,2.7rem)}
    .error-card p{margin:0 auto 2rem;max-width:46ch;color:#40546b}
  </style>
</head>
<body>
  <main class="error-page" id="contenuto">
    <section class="error-card" aria-labelledby="error-title">
      <img src="/logo-emblem.png" width="167" height="140" alt="Logo Ermanno Colazzo">
      <p class="error-code" aria-hidden="true">404</p>
      <h1 id="error-title">Pagina non trovata</h1>
      <p>L’indirizzo potrebbe essere errato oppure la pagina potrebbe essere stata spostata.</p>
      <a class="btn solid" href="/">Torna alla homepage</a>
    </section>
  </main>
</body>
</html>
