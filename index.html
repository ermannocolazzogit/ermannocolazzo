<style>
  :root{
    --blue:#003c81;
    --blue-2:#0a4a94;
    --blue-deep:#012a5c;
    --accent:#c12f57;
    --accent-dark:#9f2147;
    --bg:#ffffff;
    --bg-2:#f4f7fb;
    --ink:#2c313a;
    --body:#565d67;
    --muted:#66717e;
    --line:#e3e8ef;
    --line-blue:rgba(255,255,255,.16);
    --fs-body:clamp(1.02rem,1.25vw,1.1rem);
    --fs-lead:clamp(1.12rem,1.8vw,1.24rem);
    --lh:1.72;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:80px}
  body{
    font-family:'EB Garamond',Georgia,serif;color:var(--body);background:var(--bg);
    font-size:var(--fs-body);line-height:var(--lh);-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.display{font-family:'Nunito',Arial,sans-serif;font-weight:500;color:var(--blue)}
  .sans{font-family:'Nunito','Helvetica Neue',Arial,sans-serif}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:3px solid #ff9db4;outline-offset:3px}
  img{max-width:100%;display:block}
  .container{width:100%;max-width:1120px;margin:0 auto;padding:0 clamp(20px,4vw,32px)}
  .kicker{font-family:'Nunito',sans-serif;font-weight:500;letter-spacing:3.5px;text-transform:uppercase;font-size:.72rem;color:var(--accent)}

  .reveal{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s ease}
  .reveal.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

  /* ---------- Header ---------- */
  header{position:fixed;top:0;left:0;right:0;z-index:60;transition:all .35s ease;height:clamp(66px,9vw,90px);display:flex;align-items:center;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.06)}
  header.scrolled{height:66px;box-shadow:0 4px 22px rgba(0,30,70,.12)}
  .nav{display:flex;align-items:center;justify-content:space-between;width:100%}
  .brand{display:flex;align-items:center;gap:13px}
  .logo-emblem{height:clamp(40px,7vw,50px);width:auto;display:block;flex-shrink:0}
  .wordmark{font-family:'Nunito',sans-serif;line-height:1.12}
  .wordmark .l1{display:block;font-size:clamp(.98rem,3vw,1.4rem);font-weight:800;letter-spacing:.2px;white-space:nowrap}
  .wordmark .l2{display:block}
  .wordmark .l1 .d{color:#a2a9b3;font-weight:700;font-size:.66em}
  .wordmark .l1 .e{color:var(--blue)}
  .wordmark .l1 .c{color:#8a929d}
  .wordmark .l2{font-family:'Nunito',sans-serif;font-size:clamp(.6rem,1.7vw,.78rem);font-weight:700;color:#3d4652;letter-spacing:.2px;white-space:nowrap}
  nav.menu ul{list-style:none;display:flex;gap:clamp(18px,3vw,36px)}
  nav.menu a{font-family:'Nunito',sans-serif;font-size:.8rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--blue);position:relative;padding:6px 0}
  nav.menu a::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--accent);transition:width .3s}
  nav.menu a:hover{color:var(--accent)}
  nav.menu a:hover::after{width:100%}
  .menu-btn{display:none;background:none;border:0;color:var(--blue);font-size:1.7rem;cursor:pointer;line-height:1;padding:4px 8px}

  /* ---------- Hero ---------- */
  .hero{position:relative;min-height:100svh;display:flex;align-items:center;text-align:center;color:#fff;overflow:hidden;
    background:#003c81;
    padding:clamp(120px,20vw,150px) 0 clamp(70px,12vw,95px);}
  .hero .frame{position:absolute;inset:clamp(14px,3vw,26px);border:1px solid rgba(255,255,255,.2);pointer-events:none;z-index:2}
  .hero .frame::before{content:"";position:absolute;inset:7px;border:1px solid rgba(193,47,87,.4)}
  .hero .watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Nunito',Arial,sans-serif;font-size:44vw;color:rgba(255,255,255,.04);z-index:1;line-height:1;pointer-events:none;user-select:none}
  .hero .inner{position:relative;z-index:3;max-width:860px;margin:0 auto}
  .hero .eyebrow{font-family:'Nunito',sans-serif;letter-spacing:4.5px;text-transform:uppercase;font-size:clamp(.62rem,1.6vw,.74rem);color:#ff9db4;margin-bottom:clamp(20px,4vw,30px)}
  .hero h1{font-size:clamp(2.2rem,6.2vw,4rem);font-weight:500;letter-spacing:.5px;line-height:1.06;color:#fff}
  .hero .creds{margin-top:20px;font-family:'Nunito',Arial,sans-serif;font-size:clamp(1.02rem,2.6vw,1.28rem);font-weight:400;color:#dbe7f5;line-height:1.55;letter-spacing:.3px}
  .hero .sep{color:var(--accent);margin:0 8px;font-weight:600}
  .divider{width:74px;height:2px;background:var(--accent);margin:clamp(26px,5vw,34px) auto;position:relative}
  .divider::before{content:"";position:absolute;top:-3px;left:50%;transform:translateX(-50%) rotate(45deg);width:8px;height:8px;background:var(--accent)}
  .hero .lead{max-width:660px;margin:0 auto;font-size:var(--fs-lead);color:#e6eef8;font-style:italic}
  .hero .cta{margin-top:clamp(32px,6vw,44px);display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
  .btn{font-family:'Nunito',sans-serif;font-size:.78rem;letter-spacing:1.8px;text-transform:uppercase;padding:15px clamp(24px,4vw,34px);border:1.5px solid #fff;color:#fff;background:transparent;cursor:pointer;transition:all .3s}
  .btn:hover{background:#fff;color:var(--blue)}
  .btn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.solid:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}

  /* ---------- Pillars ---------- */
  .pillars{background:var(--blue-deep);color:#fff}
  .pillars .grid{display:grid;grid-template-columns:repeat(4,1fr)}
  .pillars .p{padding:clamp(28px,4vw,38px) 22px;text-align:center;border-right:1px solid var(--line-blue)}
  .pillars .p:last-child{border-right:0}
  .pillars .p .t{font-family:'Nunito',Arial,sans-serif;font-size:clamp(1.02rem,2.4vw,1.18rem);color:#fff;margin-bottom:6px}
  .pillars .p .s{font-family:'Nunito',sans-serif;font-size:.7rem;letter-spacing:1.4px;text-transform:uppercase;color:#8fb0d6}

  /* ---------- Sections ---------- */
  section{padding:clamp(64px,11vw,110px) 0}
  .section-head{text-align:center;margin-bottom:clamp(40px,7vw,60px)}
  .section-head .kicker{display:block;margin-bottom:15px}
  .section-head h2{font-size:clamp(1.7rem,4.6vw,2.5rem);font-weight:500}
  .section-head .divider{margin:22px auto 0}

<!-- FAQ -->
<section id="faq" class="alt">
  <div class="container">
    <div class="section-head reveal">
      <h2>FAQ</h2>
      <div class="divider"></div>
    </div>
    <div class="faq reveal">
      <details class="faq-item">
        <summary>Che cos’è una perizia grafologica forense?</summary>
        <div class="faq-a"><p>È un accertamento tecnico finalizzato a verificare l’autografia o l’apocrifia di una firma, di una sigla, di un manoscritto o di un altro documento scritto a mano. L’indagine viene svolta attraverso l’analisi delle caratteristiche grafiche e la comparazione con scritture autentiche attribuibili al soggetto interessato.</p></div>
      </details>
      <details class="faq-item">
        <summary>Qual è la differenza tra CTU e CTP?</summary>
        <div class="faq-a"><p>Il Consulente Tecnico d’Ufficio è nominato dal Giudice e svolge l’accertamento tecnico nel rispetto del quesito e del contraddittorio. Il Consulente Tecnico di Parte viene nominato da una delle parti e la assiste tecnicamente, esaminando gli atti, partecipando alle operazioni peritali e formulando osservazioni nell’interesse tecnico della parte assistita.</p></div>
      </details>
      <details class="faq-item">
        <summary>Quali prodotti della stampa possono essere esaminati?</summary>
        <div class="faq-a"><p>Possono essere sottoposti a valutazione documenti, modulistica, etichette, imballaggi, confezioni, libri, cataloghi, opuscoli, materiale pubblicitario, stampati commerciali, prodotti cartotecnici e altri manufatti realizzati mediante processi grafici e di stampa.</p></div>
      </details>
      <details class="faq-item">
        <summary>Cosa comprende una perizia tecnica nelle arti grafiche?</summary>
        <div class="faq-a"><p>Può comprendere l’esame di processi produttivi, materiali, supporti, lavorazioni, prodotti stampati, impianti, tecnologie, difetti, non conformità e contestazioni economiche o qualitative del settore grafico.</p></div>
      </details>
      <details class="faq-item">
        <summary>Quali macchinari e attrezzature possono essere sottoposti a stima?</summary>
        <div class="faq-a"><p>Possono essere valutate macchine da stampa, attrezzature di prestampa, sistemi digitali, tagliacarte, piegatrici, raccoglitrici, cucitrici, brossuratrici, fustellatrici, plastificatrici, impianti di finitura e altre attrezzature del settore grafico e cartotecnico.</p></div>
      </details>
      <details class="faq-item">
        <summary>Come si richiede una prima valutazione?</summary>
        <div class="faq-a"><p>È possibile contattare lo studio telefonicamente, tramite email o PEC, descrivendo sinteticamente il problema e indicando quali documenti, scritture comparative, prodotti o macchinari sono disponibili. Lo studio riceve su appuntamento.</p></div>
      </details>
    </div>
    <div class="faq-more reveal"><a href="/faq/">Consulta tutte le FAQ →</a></div>
  </div>
</section>

        status.className='form-status show error';
        if(button)button.disabled=false;
      }
    });
  })();
</script>
